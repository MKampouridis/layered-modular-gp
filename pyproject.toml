[project]
name = "lmgp"
version = "0.1.0"
description = "Layered modular genetic programming: does hierarchy turn compute into generalisation?"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy", "pandas", "pyarrow", "pyyaml", "pmlb"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lmgp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
